[media]
; Paths may be absolute or relative to ~/memory-machine-media/
video_file          = piece.mp4
audio_file          = piece.wav
; Pre-reversed copy of video_file, built by motion-player-reverse. The rewind
; plays this forward so no frame is ever seeked to.
reverse_file        = piece.reverse.mp4
; Optional alternative cuts of the same piece, framed for different screen
; shapes. The one closest in shape to the attached screen is used; video_file
; above is the fallback. Each needs its own reversed copy, named the same way
; motion-player-reverse writes it (piece_portrait.mp4 -> piece_portrait.reverse.mp4).
cuts                =

[playback]
; idle_mode: hold_first_frame | loop_forward | black
idle_mode           = hold_first_frame
; reverse_rate: native | fit_to_audio | <float multiplier>
reverse_rate        = native
; on_rewind_end: what happens when the rewind reaches the beginning while the
; visitor is still listening.
;   resume_forward  the piece turns and plays forward — the reward for staying
;                   present (default)
;   hold            the screen goes black and the audio fades with it
;   loop_reverse    the rewind starts over from the end
on_rewind_end       = resume_forward
; scaling: fit | fill | stretch — how the frame meets a screen of a different
; shape. fit keeps all of it and pads with black, fill covers the screen and
; crops the overflow, stretch distorts to fill.
scaling             = fit
fullscreen          = true
; display: auto | HDMI-A-1 | HDMI-A-2 (which connector to drive)
display             = auto
; display_mode: auto | 1920x1080@60 — pinned on every start, so a screen that
; was off at boot cannot leave the output negotiated to something else.
display_mode        = auto

[audio]
; ALSA/PipeWire device NAME, not index. Matched exactly first, then as a
; substring, so "USB" pins the USB adapter whatever its full model string is.
; "auto" takes the first non-HDMI output instead. Pinned rather than auto so
; the sound can never wander to a screen's speakers.
audio_sink          = USB
; Fixed volume, 0.0–1.0. Staff cannot change this at runtime.
volume              = 0.8
; Fade-out length when the sensor is released. Unused when audio_mode = always.
fade_out_ms         = 400
; on_audio_end: silence | loop
on_audio_end        = silence
; audio_mode: always | on_lift — whether the sound is tied to the sensor.
;   always   the sound loops continuously from boot and the sensor drives only
;            the picture
;   on_lift  the sound starts when the sensor engages and fades when it is
;            released — the piece's original headphone behaviour
audio_mode          = always

[lcd]
; An optional 20x4 character LCD on I2C showing a beating heart and health
; figures. The heart quickens while a visitor is engaged with the piece.
enabled             = false
i2c_bus             = 1
i2c_address         = 0x27
idle_bpm            = 60
engaged_bpm         = 100
; Heart rate while asleep; 0 = a still heart.
sleep_bpm           = 0
; layout: status | art | show. status is the readout — icon, title, state
; word, health figures. art is the panel as a small artwork: the icon
; centered with stars twinkling around it, no text at all — the choice for a
; portrait-mounted panel, where ROM text would lie sideways. show keeps the
; title always up over the centered beating icon, with stars whose energy
; follows the piece's state — calm at rest, lively while someone listens,
; every star lit for the wake-up hello.
layout              = status
; The panel's voice — printable ASCII only, up to 18 columns each. A key
; left empty on purpose (title =) means blank, not the default.
title               = memory-machine
label_idle          = at rest
label_engaged       = listening
; Spoken when a visitor stays through the whole rewind and the piece turns
; forward — the reward for staying present.
label_reward        = I see you
label_hello         = hello
label_sleep         = goodnight
label_goodbye       = goodbye
; icon: heart | star | ring | note | eye | none — the beating glyph beside
; the title — or the name of a pixel-art file at
; ~/memory-machine-media/icons/<name>.txt (up to 10x16 pixels; see COMMANDS.md).
icon                = heart
; Or draw your own 5x8 icon: 8 comma-separated row values 0-31, top to
; bottom (each row is 5 bits, e.g. 0,10,31,31,31,14,4,0 is the heart).
; Set both — the full shape and the relaxed one it beats against.
icon_full           =
icon_small          =

[sensor]
; sensor_type: switch | reed | beam | reflective | capacitive | distance |
;              hall | pir | mmwave | gpio_raw | keyboard | none
; "none" means no sensor is fitted: the piece loops forward and never rewinds.
; May be a fused list, e.g. switch+beam.
sensor_type         = capacitive
; sensor_combine: any | all  (used only when fusing multiple sensors)
sensor_combine      = any
; engaged_when: open | closed — which raw electrical state means "lifted".
; A touch pad is engaged when its contact CLOSES; a cradle switch is lifted
; when its contact OPENS. Change this whenever sensor_type changes.
engaged_when        = closed

; --- digital backends: switch, reed, beam, reflective, hall, pir, gpio_raw ---
gpio_pin            = 4
pull_up             = true

; --- distance backends ---
trigger_pin         = 23
echo_pin            = 24
threshold_cm        = 15

; --- i2c backends: capacitive (MPR121, 0x5a) and distance (VL53L0X, 0x29) ---
; One key, read by whichever backend sensor_type names, so it has to match the
; sensor in use. Leave it unset and each backend falls back to its own default.
i2c_address         = 0x5a

; --- capacitive ---
touch_channel       = 0

; --- timing, all backends ---
; First-level hardware/library debounce (ms).
bounce_time_ms      = 50
; How long a raw state must persist before it is accepted (ms).
min_lift_ms         = 250
min_replace_ms      = 250
; Force back to idle if engaged this long (minutes).
max_engaged_minutes = 30

[schedule]
; Sleep the piece overnight: screens black, audio silent, sensor ignored, LCD
; dark with a "goodnight". Times are HH:MM local; a window may span midnight
; (23:00 to 08:00). start == end disables the window.
enabled             = false
sleep_start         = 00:00
sleep_end           = 08:00

[system]
; mode: production | test. Test runs keep their logs to themselves; only
; production heartbeats carry log tails to the telemetry endpoint, and only
; while the piece is awake.
mode                = production
log_level           = info
; Stop cleanly after this many seconds; 0 = run forever. Soak tests only —
; leave at 0 for a show.
exit_after_s        = 0
log_max_mb          = 20
restart_on_crash    = true

[telemetry]
; Send HTTP POSTs to a remote endpoint for monitoring. Only http:// and
; https:// URLs are accepted.
enabled             = false
endpoint_url        = https://lab.thetechmargin.com/memorymachine/api/telemetry
interval_s          = 60
batch_size          = 10
timeout_s           = 5
log_tail_lines      = 20
